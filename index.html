<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Серёжа ❤️</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import gsap from 'gsap';
        import { CSS2DRenderer, CSS2DObject } from 'https://unpkg.com/three@0.128.0/examples/jsm/renderers/CSS2DRenderer.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.0006);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 280);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // Имя "Серёжа"
        const nameDiv = document.createElement('div');
        nameDiv.textContent = 'Серёжа';
        nameDiv.style.color = '#fff0f5';
        nameDiv.style.fontSize = '52px';
        nameDiv.style.fontWeight = 'bold';
        nameDiv.style.fontFamily = 'Georgia, serif';
        nameDiv.style.textShadow = '0 0 20px #ff3366, 0 0 40px #ff0066';
        nameDiv.style.letterSpacing = '4px';
        const nameLabel = new CSS2DObject(nameDiv);
        nameLabel.position.set(0, 0, 8);
        scene.add(nameLabel);
        gsap.to(nameLabel.scale, { duration: 1.5, x: 1.15, y: 1.15, repeat: -1, yoyo: true, ease: "sine.inOut" });

        // Форма сердца (уменьшенная)
        const heartPath = "M 0,-40 C 10,-70 50,-70 60,-45 C 70,-20 50,10 0,50 C -50,10 -70,-20 -60,-45 C -50,-70 -10,-70 0,-40 Z";
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", heartPath);
        svg.appendChild(path);
        document.body.appendChild(svg);
        svg.style.position = "absolute";
        svg.style.visibility = "hidden";
        const length = path.getTotalLength();
        const step = 0.28;
        const positions = [];
        const scaleHeart = 1.25;
        for (let i = 0; i <= length; i += step) {
            const point = path.getPointAtLength(i);
            positions.push(new THREE.Vector3(point.x * scaleHeart, -point.y * scaleHeart, 0));
        }
        document.body.removeChild(svg);

        // Генерация текстур с цифрами
        function createDigitTexture(digit) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = `Bold 48px "Segoe UI"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, `hsl(${Math.random() * 40 + 320}, 100%, 65%)`);
            grad.addColorStop(1, `hsl(${Math.random() * 30 + 340}, 100%, 55%)`);
            ctx.fillStyle = grad;
            ctx.fillText(digit, canvas.width/2, canvas.height/2);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeText(digit, canvas.width/2, canvas.height/2);
            return new THREE.CanvasTexture(canvas);
        }

        const particles = [];
        const center = new THREE.Vector3(0, 0, 0);
        for (let i = 0; i < positions.length; i++) {
            const digit = Math.floor(Math.random() * 10).toString();
            const texture = createDigitTexture(digit);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(5.5, 5.5, 1);
            sprite.userData = { finalPos: positions[i].clone() };
            sprite.position.copy(center);
            sprite.position.z += (Math.random() - 0.5) * 12;
            scene.add(sprite);
            particles.push(sprite);
        }

        // Освещение и звёзды
        scene.add(new THREE.AmbientLight(0x222222));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 800;
            starPos[i*3+1] = (Math.random() - 0.5) * 600;
            starPos[i*3+2] = (Math.random() - 0.5) * 200 - 80;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true }));
        scene.add(stars);

        // Анимация движения частиц
        const tl = gsap.timeline({ repeat: -1, yoyo: true, repeatDelay: 0.3 });
        particles.forEach((p, idx) => {
            const finalPos = p.userData.finalPos;
            const dur = gsap.utils.random(1.8, 3.8);
            const delay = gsap.utils.random(0, 0.9);
            tl.fromTo(p.position,
                { x: center.x, y: center.y, z: center.z + (Math.random()-0.5)*10 },
                { x: finalPos.x, y: finalPos.y, z: finalPos.z, duration: dur, delay: delay, ease: "elastic.out(1,0.3)" }, 0);
            p.scale.set(0.2, 0.2, 1);
            tl.fromTo(p.scale, { x: 0.2, y: 0.2 }, { x: 5.5, y: 5.5, duration: dur*0.7, delay: delay, ease: "bounce.out" }, 0);
        });

        // Доп. эффекты: мерцание цифр, пульсация, кольцо
        particles.forEach(p => {
            gsap.to(p.material, { duration: gsap.utils.random(1,2.5), opacity: 0.5, repeat: -1, yoyo: true });
            gsap.to(p.scale, { duration: gsap.utils.random(1.2,2.2), x: 6.2, y: 6.2, repeat: -1, yoyo: true });
        });

        const ringPoints = (() => {
            const count = 200;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const ang = (i / count) * Math.PI * 2;
                const r = 95;
                pos[i*3] = Math.cos(ang) * r;
                pos[i*3+1] = Math.sin(ang) * r * 0.9;
                pos[i*3+2] = (Math.random() - 0.5) * 15;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const ring = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xff66aa, size: 0.8, transparent: true }));
            scene.add(ring);
            gsap.to(ring.rotation, { duration: 20, y: Math.PI*2, repeat: -1, ease: "none" });
            return ring;
        })();

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;
            camera.position.z = 280 + Math.sin(time * 0.25) * 5;
            camera.lookAt(0, 0, 0);
            stars.rotation.y = time * 0.03;
            stars.rotation.x = Math.sin(time * 0.1) * 0.1;
            ringPoints.rotation.x = Math.sin(time * 0.2) * 0.2;
            ringPoints.rotation.z = Math.cos(time * 0.17) * 0.15;
            particles.forEach((p, idx) => {
                if (p.material.color) {
                    const r = 0.8 + Math.sin(time * 1.5 + idx) * 0.2;
                    const g = 0.5 + Math.sin(time * 1.8 + idx * 0.7) * 0.3;
                    const b = 0.6 + Math.cos(time * 1.2 + idx) * 0.3;
                    p.material.color.setRGB(r, g, b);
                }
            });
            nameLabel.position.y = Math.sin(time * 1.2) * 2;
            nameLabel.position.x = Math.cos(time * 0.9) * 1.5;
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
